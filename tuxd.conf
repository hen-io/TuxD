#################################
# TuxD                          #
#################################

tuxd:
  # off | mqtt | direct - "direct" is the primary, recommended way to
  # connect: an encrypted, authenticated WebSocket straight to a Home
  # Assistant instance running the TuxD integration, no broker needed.
  # MQTT remains fully supported for existing setups and anyone who
  # specifically wants a broker in the middle, but it's the legacy path
  # now - new features aren't required to keep MQTT-side parity.
  connection_mode: "direct"

#################################
# Home Assistant (direct mode)  #
#################################

home-assistant:
  # Only used when tuxd.connection_mode is "direct". Must be https:// - see
  # allow_insecure below.
  url: ""
  verify_ssl: true
  # A brand-new device pastes in the pairing key shown by the TuxD
  # integration's setup flow in Home Assistant - it's shared and reusable,
  # good for introducing every new device you add. Leave api_key below empty
  # until this device is approved.
  pairing_key: ""
  # Once an admin approves this device in Home Assistant (Configure >
  # Approve TuxD devices), it issues a permanent key just for this device -
  # put it here. Whenever this is set it's used instead of pairing_key
  # above, so you can freely rotate the shared pairing key without having
  # to touch already-approved devices, and can replace one device's own key
  # (e.g. after a revoke) without affecting any other device.
  api_key: ""
  retry_delay: 15
  # End-to-end encryption is required by default - a plain http:// url is
  # refused outright, since the key above and every command/value would
  # otherwise cross the network in the clear. Only set this true if you
  # specifically intend to run without TLS (e.g. a fully isolated LAN).
  allow_insecure: false

#################################
# MQTT                          #
#################################

mqtt:
  broker: ""
  port: 1883
  username: ""
  password: ""
  retry_delay: 30

#################################
# Device                        #
#################################

device:
  name: ""
  tty_output: false
  refresh_entities: 300
  sampling_interval: 1
  log_to_file: false
  log_level: "error"
  discovery_settle_delay: 2.0
  # Debounce before a config-entity change (any cfgnum/cfgsw/cfgtxt/select
  # write, e.g. picking a release channel) actually restarts the agent - a
  # burst of edits within this window coalesces into a single restart
  # instead of one per field changed.
  config_restart_delay: 30
  self_update_check_interval: 300
  # Whether the agent may EVER install an update entirely on its own
  # (unattended, e.g. right after boot with nobody watching) - off by
  # default, so a newer version just shows as "Update available" until a
  # human presses Install. Separate from self_update_allow_install below,
  # which controls whether that Install button/command exists at all -
  # this one is purely about automatic, unattended installs.
  auto_update: false
  self_update_allow_install: true
  # stable | rc | beta - which release tags count as an available TuxD
  # update. Each channel also sees everything more mature than it (rc sees
  # stable+rc, beta sees stable+rc+beta), so switching to a more
  # bleeding-edge channel never means missing a stable release.
  self_update_release_channel: "stable"
  extra_config_path: ""
  # Empty (default) means no password is required anywhere. Currently only
  # gates opening a live terminal session (connection_mode: direct) - a
  # simple shared-secret check, not hashed/salted, matching a LAN home
  # automation setup rather than a hardened multi-user system.
  password: ""
  # Default mdi icon shown for this agent wherever TuxD-Cards displays it
  # (e.g. the device-status grid card) - purely cosmetic, has no effect on
  # any Home Assistant entity/device icon.
  agent_icon: "mdi:server"

#################################
# Components                    #
#################################

components:
  web_check:
    enabled: false
    update_interval: 600
    host: "1.1.1.1"
    name: "Internet available"
    icon: "mdi:microsoft-internet-explorer"
  cpu_load:
    enabled: true
    update_interval: 30
    include_iowait_as_idle: false
    scale: "normalized"
    accuracy_decimals: 2
    host_cpu_load:
      enabled: true
      host_cores: 16
      name: "Host CPU load"

  memory_used:
    enabled: false
    update_interval: 30
    accuracy_decimals: 2
  iowait:
    enabled: false
    update_interval: 30
    accuracy_decimals: 2
  system_load:
    enabled: true
    update_interval: 60

#################################
