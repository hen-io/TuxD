#################################

lag-monitor:
  enabled: false
  host: "1.1.1.1"
  update_interval: 3
  high_latency_threshold: 10
  high_latency_sensor_name: "High Latency"
  latency_sensor_interval: 30
  latency_sensor_name: "Latency"
  latency_sensor_mode: "average"
  accuracy_decimals: 1

#################################
# LM Sensors                    #
#################################

lm_sensors:
  enabled: false
  default_interval: 15
  default_accuracy_decimals: 1
  default_icon: "mdi:thermometer"
  default_unit_of_measurement: null
  avg_sensor_name: "Average temperature"
  avg_sensor_icon: "mdi:thermometer"
  avg_accuracy_decimals: 1

