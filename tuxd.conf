#   stats:
#     enabled: true
#     containers:
#       noisy-container:
#         enabled: false
#       important-container:
#         enabled: true

#################################
# Host Update                   #
#################################

host_update:
  enabled: true
  name: "Host updates"
  count_sensor_name: "Available updates"
  packages_sensor_name: "New package version available"
  update_interval: 3600
  count_source: ""
  include_docker_updates: true
  check_cmd: ""
  list_cmd: ""
  install_cmd: ""
  install_button_name: "Update and reboot"
  use_custom_install_cmd: false
  allow_install: true
  device_class: ""

# Example:
# host_update:
#   enabled: true
#   allow_install: true
#   count_source: "updates_available"
#   install_button_name: "Update and reboot"
#   list_cmd: "apt-get -s upgrade | awk '/^Inst /{print $2}'"
#   install_cmd: "sudo apt-get update && sudo apt-get -y upgrade"

#################################
# Terminal                      #
#################################

terminal:
  terminal_input:
    enabled: true
    input_queue_limit: 25
    command_filter:
      # mode: off | blacklist | allowlist - ships "off" so the recommended
      # blacklist below is available but inactive until you opt in. A
      # command is matched as a whole (whitespace-collapsed, case-insensitive)
      # against each entry - blacklist entries match anywhere in the command
      # (so "ls; rm -rf /" is still caught), allowlist entries match only
      # as a prefix (so this is a safety net against mistakes, not a
      # sandbox - a trusted prefix with something chained after it still runs).
      mode: "off"
      blacklist:
        - "rm -rf /"
        - "mkfs"
        - "dd if=/dev/zero"
        - "dd if=/dev/random"
        - ":(){ :|:& };:"
        - "shutdown"
        - "reboot"
        - "poweroff"
        - "halt"
        - "> /dev/sda"
        - "chmod -r 777 /"
        - "chown -r / "
        - "curl | bash"
        - "curl | sh"
        - "wget | bash"
        - "wget | sh"
        - "passwd"
        - "userdel"
        - "> /etc/passwd"
        - "> /etc/shadow"
      allowlist: []
  terminal_output:
    enabled: true
    max_queue: 50
    post_interval: 0.25
    max_runtime: 60
  # Live TTY (a real interactive shell/PTY for fullscreen apps like top/
  # htop/vim, streamed live with full ANSI colors - connection_mode: direct
  # only) has no config of its own: it's available whenever terminal_input
  # above is enabled, since it's not a materially bigger capability than
  # terminal_input already grants (full command execution) - just a
  # different, fuller-featured way of using it.

