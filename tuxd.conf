#################################
# Docker                        #
#################################

docker:
  enabled: true
  compose_files:
    - "/container-data/compose.yaml"
  update_interval: 60
  image_check_interval: 3600
  restart_loop_threshold: 3
  docker_binary: "docker"
  allow_install: false
  containers_up_sensor_name: "Docker containers up"
  containers_error_sensor_name: "Docker containers with errors"
  image_update_prefix: ""
  stats:
    enabled: false
    update_interval: 30
    cpu: true
    memory: true
    network: true
    disk: true
    containers: {}

# Example:
# docker:
#   enabled: true
#   allow_install: true
#   compose_files:
#     - "/container-data/compose.yaml"
#     - "/srv/stacks/media/compose.yaml"
