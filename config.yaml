mqtt:
  broker: ""
  port: 1883
  username: ""
  password: ""
  retry_delay: 30

device:
  name: ""
  tty_output: false
  refresh_entities: 300
  sampling_interval: 1
  log_to_file: false
  log_level: "error"
  discovery_settle_delay: 2.0
  self_update_check_interval: 3600
  self_update_allow_install: true

components:
  web_check:
    enabled: false
    update_interval: 600
    host: "1.1.1.1"
    name: "Internet available"
    icon: "mdi:microsoft-internet-explorer"

  cpu_load:
    enabled: true
    update_interval: 30
    include_iowait_as_idle: false
    scale: "normalized"
    accuracy_decimals: 2
    host_cpu_load:
      enabled: false
      host_cores: 16
      name: "Host CPU load"

  memory_used:
    enabled: true
    update_interval: 30
    accuracy_decimals: 2

  iowait:
    enabled: true
    update_interval: 30
    accuracy_decimals: 2

lag-monitor:
  enabled: false
  host: "1.1.1.1"
  update_interval: 3
  high_latency_threshold: 10
  high_latency_sensor_name: "High Latency"
  latency_sensor_interval: 30
  latency_sensor_name: "Latency"
  latency_sensor_mode: "average"
  accuracy_decimals: 1

