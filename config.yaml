#################################
# Custom buttons                #
#################################

button:
  - name: "Shutdown"
    command: "sudo shutdown now"
    icon: "mdi:power"

  - name: "Reboot"
    command: "sudo reboot"
    icon: "mdi:restart"

  - name: "Update and reboot"
    command: "cd /container-data && docker compose down --remove-orphans && sudo apt update && sudo apt upgrade -y && docker compose pull && docker compose up -d && docker image prune -a -f && sudo shutdown now -r"
    icon: "mdi:update"

  - name: "Update"
    command: "cd /container-data && docker compose down --remove-orphans && sudo apt update && sudo apt upgrade -y && docker compose pull && docker compose up -d && docker image prune -a -f"
    icon: "mdi:update"

  - name: "Rebuild docker-stack"
    command: "cd /container-data && docker compose down --remove-orphans && docker compose pull && docker compose up -d && docker image prune -a -f"
    icon: "mdi:docker"

