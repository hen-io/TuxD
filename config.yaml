#################################
# LM Sensors                    #
#################################

lm_sensors:
  enabled: false
  default_interval: 15
  default_accuracy_decimals: 1
  default_icon: "mdi:thermometer"
  default_unit_of_measurement: null
  avg_sensor_name: "Average temperature"
  avg_sensor_icon: "mdi:thermometer"
  avg_accuracy_decimals: 1

# Example:
# lm_sensors:
#   enabled: true
#   sensors:
#     k10temp-pci-00c3_Tctl_temp1_input:
#       enabled: true
#       update_interval: 15
#       name: "CPU TCTL Temperature"
#       icon: "mdi:chip"
#       unit_of_measurement: "°C"
#       accuracy_decimals: 1
#       include_in_avg_sensor: false
#       device_class: "temperature"
#   overrides:
#     k10temp-pci-00c3_Tctl_temp1_input: "CPU TCTL Temperature"

#################################
# Docker                        #
#################################

docker:
  enabled: true
  compose_files:
    - "/container-data/compose.yaml"
  update_interval: 60
  image_check_interval: 3600
  restart_loop_threshold: 3
  docker_binary: "docker"
  allow_install: false
  containers_up_sensor_name: "Docker containers up"
  containers_error_sensor_name: "Docker containers with errors"
  image_update_prefix: ""
  stats:
    enabled: false
    update_interval: 30
    cpu: true
    memory: true
    network: true
    disk: true
    containers: {}

# Example:
# docker:
#   enabled: true
#   allow_install: true
#   compose_files:
#     - "/container-data/compose.yaml"
#     - "/srv/stacks/media/compose.yaml"
#   docker_binary: "sudo docker"
#   stats:
#     enabled: true
#     containers:
#       noisy-container:
#         enabled: false
#       important-container:
#         enabled: true

#################################
# Host Update                   #
#################################

host_update:
  enabled: true
  name: "Host updates"
  count_sensor_name: "Available updates"
  packages_sensor_name: "New package version available"
  update_interval: 3600
  count_source: ""
  include_docker_updates: true
  check_cmd: ""
  list_cmd: ""
  install_cmd: ""
  install_button_name: "Update and reboot"
  use_custom_install_cmd: false
  allow_install: true
  device_class: ""

# Example:
# host_update:
#   enabled: true
#   allow_install: true
#   count_source: "updates_available"
#   install_button_name: "Update and reboot"
#   list_cmd: "apt-get -s upgrade | awk '/^Inst /{print $2}'"
#   install_cmd: "sudo apt-get update && sudo apt-get -y upgrade"

#################################
# Terminal                      #
#################################

terminal:
  terminal_input:
    enabled: true
    input_queue_limit: 25
  terminal_output:
    enabled: true
    max_queue: 50
    post_interval: 1.0

