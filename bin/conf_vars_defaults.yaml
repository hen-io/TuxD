#################################
# TuxD                          #
#################################

tuxd:
  # off | mqtt | direct - how the agent connects to Home Assistant.
  connection_mode: "direct"

#################################
# Home Assistant (direct mode)  #
#################################

home-assistant:
  # Home Assistant address (https://). Only used in direct mode.
  url: ""
  verify_ssl: true
  # Shared pairing key from the TuxD integration, for a device not yet approved.
  pairing_key: ""
  # This device's own key, issued when it is approved. Used instead of
  # pairing_key when set.
  api_key: ""
  retry_delay: 15
  # Allow a plain http:// url (no encryption).
  allow_insecure: false

#################################
# MQTT                          #
#################################

mqtt:
  broker: ""
  port: 1883
  username: ""
  password: ""
  retry_delay: 15

#################################
# Device                        #
#################################

device:
  name: ""
  # en | nb - language of built-in entity names. Entity ids are not affected.
  language: nb"
  tty_output: false
  refresh_entities: 300
  sampling_interval: 1
  log_to_file: false
  log_level: "error"
  # Write logs/crashreport_<timestamp>.log when the agent crashes.
  crash_report: true
  discovery_settle_delay: 2.0
  self_update_check_interval: 300
  # Install agent updates automatically, without anyone pressing Install.
  auto_update: false
  self_update_allow_install: true
  # stable | rc | beta - which releases count as an available agent update.
  self_update_release_channel: "stable"
  extra_config_path: ""
  # Password for the terminals and the config editor, as a hash - set it
  # from Home Assistant (TuxD integration, Configure, Set agent password).
  # Empty = none. A password typed here in clear text is hashed at start.
  password_hash: ""
  # mdi icon TuxD-Cards shows for this agent.
  agent_icon: "mdi:server"
  # Commands for the built-in "Reboot" and "Shutdown" buttons.
  # Empty = "sudo reboot" / "sudo shutdown now".
  reboot_cmd: ""
  shutdown_cmd: ""

#################################
# Components                    #
#################################

components:
  web_check:
    enabled: false
    update_interval: 600
    host: "1.1.1.1"
    name: "Internet available"
    icon: "mdi:microsoft-internet-explorer"
  cpu_load:
    enabled: true
    update_interval: 30
    include_iowait_as_idle: false
    scale: "normalized"
    accuracy_decimals: 2
    host_cpu_load:
      enabled: true
      host_cores: 16
      name: "Host CPU load"

  memory_used:
    enabled: false
    update_interval: 30
    accuracy_decimals: 2
  iowait:
    enabled: false
    update_interval: 30
    accuracy_decimals: 2
  system_load:
    enabled: true
    update_interval: 60

#################################
# Lag Monitor                   #
#################################

lag-monitor:
  enabled: false
  host: "1.1.1.1"
  update_interval: 3
  high_latency_threshold: 10
  high_latency_sensor_name: "High Latency"
  latency_sensor_interval: 30
  latency_sensor_name: "Latency"
  latency_sensor_mode: "average"
  accuracy_decimals: 1

#################################
# LM Sensors                    #
#################################

lm_sensors:
  enabled: false
  default_interval: 15
  default_accuracy_decimals: 1
  default_icon: "mdi:thermometer"
  default_unit_of_measurement: null
  avg_sensor_name: "Average temperature"
  avg_sensor_icon: "mdi:thermometer"
  avg_accuracy_decimals: 1

# Example:
#   sensors:
#     k10temp-pci-00c3_Tctl_temp1_input:
#       enabled: true
#       update_interval: 15
#       name: "CPU TCTL Temperature"
#       icon: "mdi:chip"
#       unit_of_measurement: "°C"
#       accuracy_decimals: 1
#       include_in_avg_sensor: false
#       device_class: "temperature"
#   overrides:
#     k10temp-pci-00c3_Tctl_temp1_input: "CPU TCTL Temperature"

#################################
# Docker                        #
#################################

docker:
  enabled: false
  compose_files:
    - "/container-data/compose.yaml"
  update_interval: 60
  image_check_interval: 3600
  restart_loop_threshold: 3
  docker_binary: "docker"
  allow_install: false
  containers_up_sensor_name: "Docker containers up"
  containers_error_sensor_name: "Docker containers with errors"
  image_update_prefix: ""
  # An unhealthy stack raises the host's warning (default: off | warning |
  # error). enabled adds a select per stack to change it from Home
  # Assistant. Not used on a host where TugBoat is active.
  stack_alerts:
    enabled: true
    default: "warning"
    stacks: {}
  stats:
    enabled: false
    update_interval: 30
    cpu: true
    memory: true
    network: true
    disk: true
    containers: {}

# Example:
# docker:
#   enabled: true
#   allow_install: true
#   compose_files:
#     - "/container-data/compose.yaml"
#     - "/srv/stacks/media/compose.yaml"
#   docker_binary: "sudo docker"
#   stats:
#     enabled: true
#     containers:
#       noisy-container:
#         enabled: false
#       important-container:
#         enabled: true

#################################
# TugBoat                       #
#################################

# Integration with a TugBoat.py install: a health sensor per stack, plus
# selects and a button to run stack actions. path = the directory holding
# TugBoat.py.
tugboat:
  enabled: false
  path: ""
  python_bin: "python3"
  # An unhealthy stack raises the host's warning (default: off | warning |
  # error). enabled adds a select per stack to change it from Home
  # Assistant; the selects fill in "stacks".
  stack_alerts:
    enabled: true
    default: "warning"
    stacks: {}

# Example:
# tugboat:
#   enabled: true
#   path: "/container-data"
#   stack_alerts:
#     enabled: true
#     default: "error"

#################################
# Systemd                       #
#################################

systemd:
  enabled: false
  update_interval: 30
  # Only these are watched and can be started, stopped, restarted, enabled
  # or disabled from Home Assistant. "user:" in front = a user service.
  services: []
  # A listed service that fails raises the host's warning or error (default:
  # off | warning | error). enabled adds a select per service to change it
  # from Home Assistant; the selects fill in "services".
  service_alerts:
    enabled: true
    default: "warning"
    services: {}

# Example:
# systemd:
#   enabled: true
#   services:
#     - "nginx.service"
#     - "docker"
#     - "user:syncthing.service"
#   service_alerts:
#     default: "warning"
#     services:
#       nginx.service: "error"

#################################
# Proxmox VE                    #
#################################

proxmox:
  enabled: false
  update_interval: 30
  # One sensor per VM / container on this node (its status).
  guest_sensors: true
  # Bulk start guests (an action), and at boot in place of Proxmox's own
  # start. Not enabled: the action is Proxmox's own bulk start. Steps: start_vm (an id, a list or "all"), delay (90s, 2m),
  # wait. "all" = every guest with "Start at boot", in Proxmox's startup
  # order, except those a later step names.
  bulk_start_vms:
    enabled: false
    max_runtime: 1800
    order: []
  # Bulk stop guests (an action), before TuxD's Reboot / Shutdown, and at
  # every shutdown in place of Proxmox's own (the boot / shutdown units need
  # TuxD to run as root). Not enabled: the action is Proxmox's own bulk
  # stop. Steps: stop_vm, delay, wait (until the guests
  # stopped above are down). Shutdowns run in parallel.
  bulk_stop_vms:
    enabled: false
    shutdown_timeout: 180
    force_stop: true
    max_runtime: 1800
    order: []
  # A "Start at boot" guest that is not running raises the host's warning or
  # error (default: off | warning | error; "guests" by id). enabled adds a
  # select per guest to change it from Home Assistant.
  guest_alerts:
    enabled: false
    default: "off"
    guests: {}

# Example:
# proxmox:
#   enabled: true
#   bulk_start_vms:
#     enabled: true
#     order:
#       - start_vm: 222
#       - delay: 90s
#       - start_vm: all
#   bulk_stop_vms:
#     enabled: true
#     order:
#       - stop_vm: all
#       - wait: true
#       - stop_vm: 222
#         timeout: 300
#   guest_alerts:
#     default: "warning"
#     guests:
#       222: "error"

#################################
# Actions                       #
#################################

# Your own actions: picked in the Action select and run with Execute Action
# (or from the actions card). With targets, {target} in cmd is replaced by
# the one picked in the Action Target select.
actions: []

# Example:
# actions:
#   - name: "Clear app cache"
#     cmd: "sudo rm -rf /var/cache/myapp/*"
#     confirm: true
#   - name: "Restart container"
#     cmd: "docker restart {target}"
#     targets: ["web", "db"]
#     target_name: "Container"

#################################
# Host Update                   #
#################################

host_update:
  enabled: true
  name: "Host updates"
  packages_sensor_name: "New package version available"
  update_interval: 3600
  # Which commands.status entry to read the update count from.
  count_source: "updates_available"
  include_docker_updates: true
  check_cmd: ""
  list_cmd: ""
  install_cmd: ""
  # Commands for the standard "Update", "Update and reboot" (always reboots)
  # and "Update and reboot if needed" buttons. Empty = the default for this
  # system (Debian: bin/etc/debian_update.sh).
  update_cmd: ""
  update_reboot_cmd: ""
  update_reboot_if_needed_cmd: ""
  # The button whose command the update entity's Install runs.
  install_button_name: "Update and reboot if needed"
  use_custom_install_cmd: false
  allow_install: true
  # Seconds an install or update button may run before it is stopped (a
  # held package lock, a question nobody answers). 0 = no limit.
  install_timeout: 3600
  device_class: ""

# Example, with custom count, list and install commands:
# commands:
#   status:
#     updates_available:
#       enabled: true
#       cmd: "sudo apt list --upgradable 2>/dev/null | grep -c upgradable"
# host_update:
#   list_cmd: "apt-get -s upgrade | awk '/^Inst /{print $2}'"
#   install_cmd: "sudo apt-get update && sudo apt-get -y upgrade"

#################################
# Terminal                      #
#################################

terminal:
  terminal_input:
    enabled: true
    input_queue_limit: 25
    command_filter:
      # off | blacklist | allowlist - blacklist entries match anywhere in a
      # command, allowlist entries only as its prefix.
      mode: "off"
      blacklist:
        - "rm -rf /"
        - "mkfs"
        - "dd if=/dev/zero"
        - "dd if=/dev/random"
        - ":(){ :|:& };:"
        - "shutdown"
        - "reboot"
        - "poweroff"
        - "halt"
        - "> /dev/sda"
        - "chmod -r 777 /"
        - "chown -r / "
        - "curl | bash"
        - "curl | sh"
        - "wget | bash"
        - "wget | sh"
        - "passwd"
        - "userdel"
        - "> /etc/passwd"
        - "> /etc/shadow"
      allowlist: []
  terminal_output:
    enabled: true
    max_queue: 50
    post_interval: 0.25
    max_runtime: 60
  # Live TTY (direct mode only) is available whenever terminal_input is enabled.

#################################
# Commands                      #
#################################

commands: {}

